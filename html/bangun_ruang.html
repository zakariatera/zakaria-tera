     <script>
    let alas,tinggi,luassegitiga;   
    alas=4;

</script>


<script>
    let phi,r,luaslingkaran;   //Deklasrasi variable
    phi=3,14;   //Inisialisasi (memberi nilai) varisble
    r=prompt("masukan nilai");
    luaslingkaran=phi*r*r
    
    alert("luas lingkaran = " +luaslingkaran.toFixed(2));
</script>

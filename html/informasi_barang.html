<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi</title>
</head>
<h2>Informasi Barang</h2>
<body>
    <script>
        const Barang={
            nama : "rahmat",
            harga :"10k",
            jumlah :1
        };
        const Barang1={
            nama : "sakdan",
            harga :"10k",
            jumlah :1
        };

        document.write("Nama Barang = " + Barang.nama + "<br>");
        document.write("Harga Barang = " + Barang.harga + "<br>");
        document.write("Jumlah Barang = " + Barang.jumlah + "<br>");
        
        document.write("Nama Barang = " + Barang1.nama + "<br>");
        document.write("Harga Barang = " + Barang1.harga + "<br>");
        document.write("Jumlah Barang = " + Barang1.jumlah);
    </script>
    
</body>
</html>

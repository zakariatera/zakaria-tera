<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #add;
        }
    </style>

</head>
<body>
    <h2 style="text-align: center;">Data Siswa</h2>
    <p id="ok"></p>
    <table id="table-datasiswa">
        <tr>
            <th>Ranking</th>
            <th>NISN</th>
            <th>Nama</th>
            <th>MTK</th>
            <th>IPA</th>
            <th>PAI</th>
            <th>Rata-rata</th>
        </tr>
    </table>
    
    <script>
        let datasiswa = [
            {nisn: "001", nama: "Joko Santoso", mtk: 85, ipa: 100, pai: 100},
            {nisn: "002", nama: "Adi Jaya", mtk: 90, ipa: 95, pai: 100},
            {nisn: "003", nama: "Basuki", mtk: 85, ipa: 12, pai: 19},
            {nisn: "004", nama: "Randi Gutama", mtk: 85, ipa: 100, pai: 100},
            {nisn: "005", nama: "Nurhadi", mtk: 85, ipa: 100, pai: 100},
            {nisn: "006", nama: "Sugiri", mtk: 85, ipa: 100, pai: 100},
        ];

        // Calculate average scores and add ranking
        datasiswa.forEach(siswa => {
            siswa.rata = (siswa.mtk + siswa.ipa + siswa.pai) / 3;
        });

        // Sort by average score in descending order for ranking
        datasiswa.sort((a, b) => b.rata - a.rata);

        // Populate the table with data
        datasiswa.forEach((siswa, index) => {
            let row = `<tr>
                <td>${index + 1}</td>
                <td>${siswa.nisn}</td>
                <td>${siswa.nama}</td>
                <td>${siswa.mtk}</td>
                <td>${siswa.ipa}</td>
                <td>${siswa.pai}</td>
                <td>${siswa.rata.toFixed(2)}</td>
            </tr>`;
            document.getElementById("table-datasiswa").innerHTML += row;
        });

        let inputNama = prompt("Masukkan nama:");
        let found = false;

        for (let i = 0; i < datasiswa.length; i++) {
            if (inputNama.toLowerCase() === datasiswa[i].nama.toLowerCase()) {
                document.getElementById("ok").innerHTML = "Nama: " + datasiswa[i].nama + 
                    "<br> NISN: " + datasiswa[i].nisn + 
                    "<br> Nilai MTK: " + datasiswa[i].mtk + 
                    "<br> Nilai IPA: " + datasiswa[i].ipa + 
                    "<br> Nilai PAI: " + datasiswa[i].pai + 
                    "<br> Rata-rata: " + datasiswa[i].rata.toFixed(2) + 
                    "<br> Ranking: " + (i + 1);
                found = true;
                break;
            }
        }

        if (!found) {
            document.getElementById("ok").innerHTML = "Data anda salah";
        }
    </script>
</body>
</html>

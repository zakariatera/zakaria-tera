<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet" />
    <title>Toko Online - Kelola Produk</title>
  </head>
  <body
    class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col overflow-x-hidden"
  >
    <header
      class="bg-gray-300 flex flex-row justify-between items-center p-3 sm:p-4 border-b-2 border-gray-800 w-full sticky top-0 z-30"
    >
      <div class="flex items-center gap-2">
        <button
          id="menuToggle"
          class="md:hidden text-black focus:outline-none p-1 border border-gray-800 rounded bg-gray-200"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="4"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>
        <h2 class="text-base sm:text-xl font-bold text-black tracking-tight">
          TOKO ONLINEKU
        </h2>
      </div>

      <div class="flex items-center gap-2 sm:gap-3" id="headerAuthArea">
        <span
          class="text-black text-xs sm:text-sm font-semibold hover:underline truncate max-w-30 sm:max-w-none"
        >
          <a href="profil.html" id="userNameLink">Hai, Pengguna!</a>
        </span>
        <button
          class="border border-gray-800 bg-gray-200 hover:bg-gray-300 text-black px-2 sm:px-3 py-1 text-xs sm:text-sm font-semibold shadow rounded-sm cursor-pointer"
          onclick="Log()"
        >
          Logout
        </button>
      </div>
    </header>

    <div class="flex flex-1 w-full relative">
      <aside
        id="sidebar"
        class="fixed md:static inset-y-0 left-0 z-20 w-56 md:w-48 bg-white border-r-2 border-blue-900 flex flex-col justify-between py-4 shrink-0 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out shadow-lg md:shadow-none top-14 md:top-0 h-[calc(100vh-57px)] md:h-auto"
      >
        <ul
          class="text-center font-semibold text-black space-y-2 sm:space-y-4 uppercase tracking-wider text-xs sm:text-sm px-2 md:px-0"
        >
          <li>
            <button
              class="cursor-pointer hover:bg-gray-100 py-2 w-full"
              onclick="Dash()"
            >
              Dashboard
            </button>
          </li>
          <li>
            <button
              class="cursor-pointer py-2 w-full bg-sky-300 border-2 border-blue-900 rounded md:rounded-none"
              onclick="Pro()"
            >
              Products
            </button>
          </li>
          <li>
            <button
              class="cursor-pointer hover:bg-gray-100 py-2 w-full rounded md:rounded-none"
              onclick="Kat()"
            >
              Kategori
            </button>
          </li>
          <li>
            <button
              class="cursor-pointer hover:bg-gray-100 py-2 w-full rounded md:rounded-none"
              onclick="Trans()"
            >
              Transaksi
            </button>
          </li>
          <li>
            <button
              class="cursor-pointer hover:bg-gray-100 py-2 w-full rounded md:rounded-none"
              onclick="Lap()"
            >
              Laporan
            </button>
          </li>
          <li>
            <button
              class="cursor-pointer hover:bg-gray-100 py-2 w-full rounded md:rounded-none"
              onclick="Peng()"
            >
              Pengguna
            </button>
          </li>
        </ul>
      </aside>

      <div
        id="sidebarOverlay"
        class="fixed inset-0 bg-black/50 z-10 hidden md:hidden"
      ></div>

      <main class="flex-1 p-3 sm:p-6 md:p-8 w-full min-w-0">
        <div
          class="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-6 md:p-8"
        >
          <header
            class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 sm:pb-6 border-b border-slate-100"
          >
            <div>
              <h1
                class="text-xl sm:text-2xl md:text-3xl font-bold text-slate-900 tracking-tight"
              >
                Kelola Produk
              </h1>
              <p class="text-xs sm:text-sm text-slate-500 mt-1">
                Daftar persediaan barang dan harga toko Anda.
              </p>
            </div>

            <button
              id="btnBukaModal"
              type="button"
              class="inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium text-xs sm:text-sm px-4 py-2.5 rounded-lg transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 w-full sm:w-auto"
            >
              + Tambah Produk
            </button>
          </header>

          <section class="mt-4 sm:mt-6">
            <div class="overflow-x-auto rounded-xl border border-slate-200">
              <table
                class="w-full text-left border-collapse text-xs sm:text-sm min-w-[500px]"
              >
                <thead
                  class="bg-slate-100/80 text-slate-700 font-semibold uppercase tracking-wider text-xs border-b border-slate-200"
                >
                  <tr>
                    <th
                      scope="col"
                      class="py-3 px-3 sm:px-4 text-center w-12 sm:w-16"
                    >
                      No
                    </th>
                    <th scope="col" class="py-3 px-3 sm:px-4">Nama Produk</th>
                    <th scope="col" class="py-3 px-3 sm:px-4 text-center">
                      Jumlah
                    </th>
                    <th scope="col" class="py-3 px-3 sm:px-4 text-right">
                      Harga
                    </th>
                    <th
                      scope="col"
                      class="py-3 px-3 sm:px-4 text-center w-28 sm:w-36"
                    >
                      Aksi
                    </th>
                  </tr>
                </thead>
                <tbody
                  id="tabelProdukBody"
                  class="divide-y divide-slate-200 bg-white"
                ></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div
      id="modalTambah"
      class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4"
    >
      <div
        class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-5 sm:p-6"
      >
        <div
          class="flex justify-between items-center pb-3 sm:pb-4 border-b border-slate-100"
        >
          <h3
            id="modalTitle"
            class="text-base sm:text-lg font-bold text-slate-900"
          >
            Tambah Produk Baru
          </h3>
          <button
            id="btnTutupModal"
            type="button"
            class="text-slate-400 hover:text-slate-600 font-bold text-2xl leading-none"
          >
            &times;
          </button>
        </div>

        <form id="formTambahProduk" class="mt-4 space-y-3 sm:space-y-4">
          <input type="hidden" id="editIndex" value="-1" />

          <div>
            <label
              for="namaProduk"
              class="block text-xs font-semibold text-slate-700 uppercase mb-1"
              >Nama Produk</label
            >
            <input
              type="text"
              id="namaProduk"
              required
              placeholder="Contoh: Laptop Gaming"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label
              for="jumlahProduk"
              class="block text-xs font-semibold text-slate-700 uppercase mb-1"
              >Jumlah Unit</label
            >
            <input
              type="number"
              id="jumlahProduk"
              min="1"
              required
              placeholder="10"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label
              for="hargaProduk"
              class="block text-xs font-semibold text-slate-700 uppercase mb-1"
              >Harga (Rp)</label
            >
            <input
              type="number"
              id="hargaProduk"
              min="0"
              required
              placeholder="5000000"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div
            class="flex justify-end gap-2 sm:gap-3 pt-4 border-t border-slate-100"
          >
            <button
              id="btnBatal"
              type="button"
              class="px-3 sm:px-4 py-2 border border-slate-300 rounded-lg text-xs sm:text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors"
            >
              Batal
            </button>
            <button
              id="btnSubmitForm"
              type="submit"
              class="px-3 sm:px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs sm:text-sm font-medium transition-colors shadow-sm focus:ring-2 focus:ring-indigo-500"
            >
              Simpan Produk
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const menuToggle = document.getElementById("menuToggle");
      const sidebar = document.getElementById("sidebar");
      const sidebarOverlay = document.getElementById("sidebarOverlay");

      function toggleSidebar() {
        sidebar.classList.toggle("-translate-x-full");
        sidebarOverlay.classList.toggle("hidden");
      }

      menuToggle?.addEventListener("click", toggleSidebar);
      sidebarOverlay?.addEventListener("click", toggleSidebar);

      document.addEventListener("DOMContentLoaded", function () {
        const currentUserData = localStorage.getItem("currentUser");
        const userNameLink = document.getElementById("userNameLink");

        if (currentUserData) {
          try {
            const user = JSON.parse(currentUserData);
            if (user && user.name)
              userNameLink.innerText = `Hai, ${user.name}!`;
          } catch (e) {
            console.error(e);
          }
        } else {
          renderGuestHeader();
        }
      });

      function renderGuestHeader() {
        const headerAuthArea = document.getElementById("headerAuthArea");
        if (headerAuthArea) {
          headerAuthArea.innerHTML = `
            <button onclick="window.location.href='login.html'" class="border border-gray-800 bg-blue-600 hover:bg-blue-700 text-white px-2 sm:px-3 py-1 text-xs sm:text-sm font-semibold shadow rounded-sm cursor-pointer">
              Masuk
            </button>
            <button onclick="window.location.href='index.html'" class="border border-gray-800 bg-gray-200 hover:bg-gray-300 text-black px-2 sm:px-3 py-1 text-xs sm:text-sm font-semibold shadow rounded-sm cursor-pointer">
              Daftar
            </button>
          `;
        }
      }

      function Log() {
        localStorage.removeItem("currentUser");
        renderGuestHeader();
      }
      function Dash() {
        window.location.href = "online.html";
      }
      function Pro() {
        window.location.href = "produk.html";
      }
      function Kat() {
        window.location.href = "kel-kat.html";
      }
      function Trans() {
        window.location.href = "";
      }
      function Lap() {
        window.location.href = "";
      }
      function Peng() {
        window.location.href = "kel-peng.html";
      }

      const defaultProduk = [
        { nama: "Laptop Lenovo LOQ", jumlah: 100, harga: 16500000 },
        { nama: "Laptop Asus Vivobook", jumlah: 100, harga: 14800000 },
        { nama: "Acer Aspire Lite 14", jumlah: 100, harga: 9800000 },
        { nama: "Tecno Camon Phone", jumlah: 100, harga: 4700000 },
      ];

      let daftarProduk = [];
      const storageData = localStorage.getItem("daftarProduk");

      if (storageData) {
        try {
          const parsedData = JSON.parse(storageData);
          if (Array.isArray(parsedData) && parsedData.length > 0) {
            daftarProduk = parsedData;
          } else {
            daftarProduk = defaultProduk;
            localStorage.setItem("daftarProduk", JSON.stringify(daftarProduk));
          }
        } catch (e) {
          daftarProduk = defaultProduk;
          localStorage.setItem("daftarProduk", JSON.stringify(daftarProduk));
        }
      } else {
        daftarProduk = defaultProduk;
        localStorage.setItem("daftarProduk", JSON.stringify(daftarProduk));
      }

      function simpanKeStorage() {
        localStorage.setItem("daftarProduk", JSON.stringify(daftarProduk));
      }

      const tabelBody = document.getElementById("tabelProdukBody");
      const modalTambah = document.getElementById("modalTambah");
      const modalTitle = document.getElementById("modalTitle");
      const btnBukaModal = document.getElementById("btnBukaModal");
      const btnTutupModal = document.getElementById("btnTutupModal");
      const btnBatal = document.getElementById("btnBatal");
      const formTambahProduk = document.getElementById("formTambahProduk");
      const editIndexInput = document.getElementById("editIndex");
      const btnSubmitForm = document.getElementById("btnSubmitForm");

      function renderTabel() {
        if (!tabelBody) return;
        tabelBody.innerHTML = "";

        if (daftarProduk.length === 0) {
          tabelBody.innerHTML = `
            <tr>
              <td colspan="5" class="py-6 text-center text-slate-400 italic">Belum ada produk. Tambahkan produk baru!</td>
            </tr>
          `;
          return;
        }

        daftarProduk.forEach((produk, index) => {
          const badgeColor =
            produk.jumlah > 20
              ? "bg-emerald-50 text-emerald-700 border-emerald-200"
              : "bg-amber-50 text-amber-700 border-amber-200";

          const angkaBersih =
            Number(String(produk.harga).replace(/[^0-9]/g, "")) || 0;
          const hargaFormatted = "Rp " + angkaBersih.toLocaleString("id-ID");

          const rowHTML = `
            <tr class="hover:bg-slate-50/80 transition-colors">
              <td class="py-3 px-3 sm:px-4 text-center text-slate-500 font-medium">${index + 1}</td>
              <td class="py-3 px-3 sm:px-4 font-semibold text-slate-900">${produk.nama}</td>
              <td class="py-3 px-3 sm:px-4 text-center">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-medium border ${badgeColor}">
                  ${produk.jumlah} unit
                </span>
              </td>
              <td class="py-3 px-3 sm:px-4 text-right font-medium text-slate-900">${hargaFormatted}</td>
              <td class="py-3 px-3 sm:px-4 text-center space-x-1">
                <button type="button" onclick="editProduk(${index})" class="inline-flex items-center justify-center px-2 py-1 border border-slate-300 shadow-sm text-xs font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50 hover:text-indigo-600 focus:outline-none transition-colors">Edit</button>
                <button type="button" onclick="hapusProduk(${index})" class="inline-flex items-center justify-center px-2 py-1 border border-red-200 shadow-sm text-xs font-medium rounded-md text-red-600 bg-white hover:bg-red-50 focus:outline-none transition-colors">Hapus</button>
              </td>
            </tr>
          `;
          tabelBody.insertAdjacentHTML("beforeend", rowHTML);
        });
      }

      const toggleModal = () => modalTambah?.classList.toggle("hidden");

      btnBukaModal?.addEventListener("click", () => {
        formTambahProduk?.reset();
        editIndexInput.value = "-1";
        modalTitle.innerText = "Tambah Produk Baru";
        btnSubmitForm.innerText = "Simpan Produk";
        toggleModal();
      });

      btnTutupModal?.addEventListener("click", toggleModal);
      btnBatal?.addEventListener("click", toggleModal);

      renderTabel();
    </script>
  </body>
</html>

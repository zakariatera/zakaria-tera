<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Saya</title>
    <link href="./src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-linear-to-br from-slate-50 via-gray-100 to-slate-200 text-slate-700 min-h-screen p-4 md:p-8 flex flex-col items-center justify-center"
  >
    <div class="w-full max-w-5xl mb-4">
      <a
        href="online.html"
        class="inline-flex items-center gap-2 text-slate-600 hover:text-slate-900 font-semibold text-sm transition"
      >
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Toko
      </a>
    </div>

    <article
      class="bg-white border border-slate-200/80 w-full max-w-5xl rounded-2xl p-6 shadow-xl grid grid-cols-1 lg:grid-cols-12 gap-6 relative overflow-hidden"
    >
      <section
        class="lg:col-span-5 bg-linear-to-b from-slate-50 to-gray-100/70 border border-slate-200 rounded-xl p-6 flex flex-col justify-between shadow-inner"
      >
        <div>
          <header
            class="mb-6 pb-3 border-b border-slate-200 flex justify-between items-center"
          >
            <h2 class="text-xl font-bold text-slate-800 tracking-wide">
              Kelola Profil
            </h2>
            <span
              class="text-xs bg-slate-200 text-slate-700 border border-slate-300 font-semibold px-2.5 py-0.5 rounded-full"
              >User</span
            >
          </header>

          <form class="space-y-4" onsubmit="handleSaveProfile(event)">
            <div>
              <label
                class="block text-xs font-semibold text-slate-500 uppercase mb-1"
                >Nama Lengkap</label
              >
              <input
                type="text"
                id="profileName"
                class="w-full bg-white border border-slate-300 text-slate-800 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-400 transition"
                required
              />
            </div>

            <div>
              <label
                class="block text-xs font-semibold text-slate-500 uppercase mb-1"
                >E-mail</label
              >
              <input
                type="email"
                id="profileEmail"
                class="w-full bg-white border border-slate-300 text-slate-800 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-400 transition"
                required
              />
            </div>

            <div>
              <label
                class="block text-xs font-semibold text-slate-500 uppercase mb-1"
                >No. HP</label
              >
              <input
                type="number"
                id="profilePhone"
                placeholder="085623176980"
                class="w-full bg-white border border-slate-300 text-slate-800 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-400 transition"
              />
            </div>

            <div>
              <label
                class="block text-xs font-semibold text-slate-500 uppercase mb-1"
                >Alamat</label
              >
              <textarea
                id="profileAddress"
                rows="2"
                class="w-full bg-white border border-slate-300 text-slate-800 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-400 transition resize-none"
              >
Jl. Danau Sentani 012 Sukorejo</textarea
              >
            </div>

            <div>
              <label
                class="block text-xs font-semibold text-slate-500 uppercase mb-1"
                >Ganti Password</label
              >
              <input
                type="password"
                id="profilePassword"
                placeholder="Masukkan password baru"
                class="w-full bg-white border border-slate-300 text-slate-800 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-400 transition"
              />
            </div>

            <button
              type="submit"
              class="w-full mt-2 bg-linear-to-r from-slate-700 to-slate-900 hover:from-slate-800 hover:to-black text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition uppercase text-xs tracking-wider"
            >
              Simpan Profil
            </button>
          </form>

          <div class="mt-6 pt-4 border-t border-slate-200">
            <button
              onclick="handleLogout()"
              class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg shadow transition text-xs uppercase tracking-wider flex items-center justify-center gap-2"
            >
              <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
          </div>
        </div>
      </section>

      <div class="lg:col-span-7 flex flex-col gap-6">
        <section
          class="bg-linear-to-b from-slate-50 to-gray-100/70 border border-slate-200 rounded-xl p-5 shadow-inner"
        >
          <header
            class="text-center mb-4 bg-white/80 py-1.5 rounded-lg border border-slate-200 shadow-sm"
          >
            <h3
              class="text-xs font-bold uppercase tracking-wider text-slate-600"
            >
              Produk Dibeli
            </h3>
          </header>

          <div class="grid grid-cols-3 gap-3">
            <div
              class="bg-white border border-slate-200 rounded-xl p-3 flex flex-col items-center text-center relative group hover:border-slate-400 hover:shadow-md transition"
            >
              <span
                class="absolute top-2 right-2 text-[10px] bg-amber-50 text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded font-bold"
                >Lvl 1</span
              >
              <div
                class="w-12 h-12 bg-slate-100 rounded-lg flex items-center justify-center my-2 text-slate-700 group-hover:bg-slate-200 transition"
              >
                <i class="fa-solid fa-box text-xl"></i>
              </div>
              <h4 class="text-xs font-semibold text-slate-800 truncate w-full">
                Produk 1
              </h4>
              <p class="text-tiny text-slate-500">Rp 150.000</p>
            </div>

            <div
              class="bg-white border border-slate-200 rounded-xl p-3 flex flex-col items-center text-center relative group hover:border-slate-400 hover:shadow-md transition"
            >
              <span
                class="absolute top-2 right-2 text-tiny bg-amber-50 text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded font-bold"
                >Lvl 2</span
              >
              <div
                class="w-12 h-12 bg-slate-100 rounded-lg flex items-center justify-center my-2 text-slate-700 group-hover:bg-slate-200 transition"
              >
                <i class="fa-solid fa-bag-shopping text-xl"></i>
              </div>
              <h4 class="text-xs font-semibold text-slate-800 truncate w-full">
                Produk 2
              </h4>
              <p class="text-tiny text-slate-500">Rp 250.000</p>
            </div>

            <div
              class="bg-white border border-slate-200 rounded-xl p-3 flex flex-col items-center text-center relative group hover:border-slate-400 hover:shadow-md transition"
            >
              <span
                class="absolute top-2 right-2 text-[10px] bg-amber-50 text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded font-bold"
                >Lvl 3</span
              >
              <div
                class="w-12 h-12 bg-slate-100 rounded-lg flex items-center justify-center my-2 text-slate-700 group-hover:bg-slate-200 transition"
              >
                <i class="fa-solid fa-cart-flatbed text-xl"></i>
              </div>
              <h4 class="text-xs font-semibold text-slate-800 truncate w-full">
                Produk 3
              </h4>
              <p class="text-tiny text-slate-500">Rp 300.000</p>
            </div>
          </div>
        </section>

        <section
          class="bg-linear-to-b from-slate-50 to-gray-100/70 border border-slate-200 rounded-xl p-5 flex-1 flex flex-col justify-between shadow-inner"
        >
          <div>
            <header
              class="text-center mb-4 bg-white/80 py-1.5 rounded-lg border border-slate-200 shadow-sm"
            >
              <h3
                class="text-xs font-bold uppercase tracking-wider text-slate-600"
              >
                Riwayat Aktivitas
              </h3>
            </header>

            <div class="space-y-2">
              <div
                class="bg-white border border-slate-200 rounded-lg p-3 flex justify-between items-center text-xs shadow-sm"
              >
                <div class="flex items-center gap-2">
                  <i class="fa-solid fa-clock-rotate-left text-slate-500"></i>
                  <span class="text-slate-700 font-medium"
                    >Status Transaksi Terakhir</span
                  >
                </div>
                <span
                  class="text-emerald-600 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded font-semibold"
                  >Selesai</span
                >
              </div>

              <div
                class="bg-white border border-slate-200 rounded-lg p-3 flex justify-between items-center text-xs shadow-sm"
              >
                <div class="flex items-center gap-2">
                  <i class="fa-solid fa-star text-amber-500"></i>
                  <span class="text-slate-700 font-medium"
                    >Poin Hadiah Belanja</span
                  >
                </div>
                <span
                  class="text-slate-800 font-semibold bg-slate-100 border border-slate-200 px-2 py-0.5 rounded"
                  >354 / 354 Pts</span
                >
              </div>
            </div>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-200 text-center">
            <p class="text-[11px] text-slate-400 italic">
              Bagian riwayat ini dapat ditambahkan detail lainnya sesuai
              kebutuhan.
            </p>
          </div>
        </section>
      </div>
    </article>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const currentUser = JSON.parse(localStorage.getItem("currentUser"));

        if (!currentUser) {
          window.location.href = "index.html";
          return;
        }

        document.getElementById("profileName").value = currentUser.name || "";
        document.getElementById("profileEmail").value = currentUser.email || "";
        document.getElementById("profilePassword").value =
          currentUser.password || "";
      });

      function handleSaveProfile(e) {
        e.preventDefault();

        const updatedName = document.getElementById("profileName").value.trim();
        const updatedEmail = document
          .getElementById("profileEmail")
          .value.trim()
          .toLowerCase();
        const updatedPassword =
          document.getElementById("profilePassword").value;

        if (!updatedName || !updatedEmail) {
          alert("Nama dan Email tidak boleh kosong!");
          return;
        }

        const updatedUser = {
          name: updatedName,
          email: updatedEmail,
          password: updatedPassword,
        };

        localStorage.setItem("currentUser", JSON.stringify(updatedUser));
        localStorage.setItem("registeredUser", JSON.stringify(updatedUser));

        alert("Profil berhasil diperbarui!");

        window.location.href = "online.html";
      }

      function handleLogout() {
        localStorage.removeItem("currentUser");
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
